; DefaultSettings.SA.ini - change the game's DEFAULT controls/settings.
;
; The rules below are applied ONLY when the game is on its stock defaults:
;   - at startup, if Documents\GTA San Andreas User Files\gta_sa.set does not exist
;   - right after the game resets them (Options > Controller Setup > the defaults entry)
; This plugin never reads or edits gta_sa.set, and does nothing at startup if it exists (your saved settings win).
;   Restore Defaults is the exception by design: the game then saves its settings, so gta_sa.set
;   is rewritten by the game with the INI values as the new defaults.
; Everything is logged to DefaultSettings.SA.log.
;
; Every option is listed with its stock value, commented out (;) except the active lines described below.
; Remove the leading ';' and change the value to use an option. Anything after a ' ;' is a comment.
; Bad lines are logged and ignored.
;
; Key rule:   ACTION=KEY                 keyboard slot 0 (the main key)
;             ACTION.Slot1=KEY           keyboard slot 1 (the "optional extra key")
;   options after KEY (space separated):
;     OnlyIfLayout=QWERTZ,QWERTY,AZERTY,ANY   apply only on these layouts (a list separated by ',', no spaces).
;                                       Detected from the keyboard: QWERTZ = 'Y' key at scancode 0x2C, AZERTY = 'A' at 0x10
;     ClearDuplicates                   also unbind this key from other actions in the same slot
;                                       (never from slots that another rule of this INI sets)
;   KEY: a letter/digit/punctuation character (A, 5, [), or a name: SPACE ESC F1..F12 INS DEL HOME END
;        PGUP PGDN UP DOWN LEFT RIGHT DIVIDE TIMES PLUS MINUS PADDEL PADEND PADDOWN PADPGDN PADLEFT PAD5
;        NUMLOCK PADRIGHT PADHOME PADUP PADPGUP PADINS PADENTER SCROLL PAUSE BACKSP TAB CAPSLK ENTER
;        LSHIFT RSHIFT SHIFT LCTRL RCTRL LALT RALT LWIN RWIN APPS, or NONE (leave the slot unbound).
;        A number (decimal or 0x..) 32-255 / 1000-1056 is taken as a raw key code.
;
; Combining rules: rules run top to bottom and every rule whose conditions match is applied, so for the same
; action and slot the LATER matching line wins. That makes a general rule plus layout exceptions easy:
;
;   VEHICLE_LOOKLEFT=X                        -> X on every layout
;   VEHICLE_LOOKLEFT=A OnlyIfLayout=AZERTY    -> ...but A on AZERTY (the line above is applied first, then replaced)
;
;   PED_DUCK=C OnlyIfLayout=QWERTZ,QWERTY     -> one rule for several layouts
;   PED_DUCK.Slot1=NONE                       -> slots are independent: slot 0 and slot 1 do not affect each other
;
; The order is the order in this file, not the action order. Put the general line FIRST and the exceptions after it.
; Nothing checks that combinations make sense (e.g. two actions on one key): the log lists both applied rules and a
; NOTE for keys that end up on two actions; add ClearDuplicates to a rule if you want the other binding removed.
;
; Active as shipped: sprint and jump swapped, "Invert Mouse Y" Off, the QWERTZ fix for Conversation Yes and
; ZQSD movement on AZERTY keyboards. Comment a line out with ';' to get the game's stock value back.
; Stock values below are for a non-German, non-French game language; where the language changes them
; the line carries a note. Stock values come from community documentation; the first-run log shows the real ones.
;
; Under every active line the original (stock) line is kept, commented out, for reference. To get the stock value
; back, comment out the ACTIVE line. Do not uncomment the stock line below it: it would come later in the file and
; override the rule above it (see "Combining rules").

[Mouse]
; Mouse (applied after the controller page is reset to defaults, and at startup without gta_sa.set).
; Invert Mouse Y Off: modern games do not invert the vertical look by default (the game's stock value is On).
InvertY=0
;InvertY=1      ; menu entry "Invert Mouse Y": 1 = On, 0 = Off. The menu shows the negated byte; the plugin handles that (0 or 1)
;Sensitivity=50      ; slider "Mouse Sensitivity" in percent; the menu limits it to about 6-100. Only the saved (horizontal) value is set, like the slider. A lower value suits a modern high-DPI mouse, but only use it with a mod that fixes the vertical sensitivity (such as SilentPatch): in the plain game the vertical sensitivity is always 25% of the horizontal one (0 to 100)
;MouseSteering=0      ; menu entry "Mouse Steering" (steer vehicles with the mouse) (0 or 1)
;MouseFlying=1      ; menu entry "Mouse Flying" (fly aircraft with the mouse) (0 or 1)

[Gamepad]
; Gamepad (same moment as the mouse).
;InvertX1=0      ; invert the left stick, horizontal (0 or 1)
;InvertY1=0      ; invert the left stick, vertical (0 or 1)
;InvertX2=0      ; invert the right stick, horizontal (0 or 1)
;InvertY2=0      ; invert the right stick, vertical (0 or 1)
;SwapAxis1=0      ; swap the axes of the left stick (0 or 1)
;SwapAxis2=0      ; swap the axes of the right stick (0 or 1)

[Display]
; Display and graphics (applied after the display pages are reset).
; NEW and not yet tested in the game: everything in [Gamepad], [Display] and [Audio]. They are listed with their
; stock values; change one at a time and check DefaultSettings.SA.log (it shows the value before and after).
;FrameLimiter=1      ; menu entry "Frame Limiter" (on = 30 fps; a plugin that offers more fps choices uses the same byte, see [Memory]) (0 or 1)
;Brightness=256      ; slider "Brightness", raw value (the slider shows value / 384) (0 to 384)
;DrawDistance=1.2      ; slider "Draw Distance", raw value (the slider shows (value - 0.925) / 0.875) (0.925 to 1.8)
;Hud=1      ; menu entry "HUD Mode" (0 or 1)
;RadarMode=0      ; menu entry "Radar Mode"; a number or a name (0 to 2, or a name: MAPS_AND_BLIPS,BLIPS_ONLY,OFF)
;MapLegend=0      ; menu entry "Map Legend" (0 or 1)
;Widescreen=0      ; menu entry "Widescreen" (HUD/menu scaling) (0 or 1)
;Subtitles=0      ; menu entry "Subtitles"; the stock value is what this game version's reset code writes (0 or 1)
;BlipLocations=1      ; map blips: locations (0 or 1)
;BlipContacts=1      ; map blips: contacts (0 or 1)
;BlipMissions=1      ; map blips: missions (0 or 1)
;BlipOther=1      ; map blips: other (0 or 1)
;BlipGangAreas=1      ; map blips: gang areas (0 or 1)
;MipMapping=1      ; menu entry "MIP Mapping"; the game applies it when it starts a game or in the main menu (0 or 1)
;SavePhotos=1      ; menu entry "Save Photos" (0 or 1)
;FxQuality=2      ; menu entry "Effects Quality"; a number or a name (0 to 3, or a name: LOW,MEDIUM,HIGH,VERY_HIGH)

[Audio]
; Audio (applied after the audio page is reset).
;SfxVolume=64      ; slider "SFX Volume", raw value (the slider shows value / 64) (0 to 64)
;RadioVolume=64      ; slider "Radio Volume", raw value (the slider shows value / 64) (0 to 64)
;RadioEq=1      ; menu entry "Radio Equalizer" (0 or 1)
;RadioAutoSelect=1      ; menu entry "Radio Auto Select" (0 or 1)
;RadioMode=0      ; menu entry "User Tracks Play Mode"; a number or a name (0 to 2, or a name: RADIO,RANDOM,SEQUENTIAL)
;TracksAutoScan=0      ; menu entry "User Tracks Auto Scan" (0 or 1)

[Memory]
; Advanced: write any value into the game's memory at a defaults moment, e.g. a setting of another mod
; that resets itself when you restore the defaults. A wrong address or type can crash the game or corrupt it.
;
;   Label = ADDRESS TYPE VALUE [When=...] [OnlyIfLayout=...]
;
;   Label    any name you like (only shown in the log)
;   ADDRESS  0x400000 - 0xFFFFFF (the game image and its data), hex (0x..) or decimal
;   TYPE     u8 i8 u16 i16 u32 i32 float double   (aliases: byte, word, short, dword, int)
;   VALUE    a number that fits the type (hex 0x.. allowed for integers)
;   When     which defaults moments write it: ALL (default: startup without gta_sa.set and every reset page),
;            or a list of KEYS, MOUSE, DISPLAY, AUDIO separated by ',' (no spaces)
;            The moments are: startup = all; Controller Setup defaults = KEYS and MOUSE; Display Setup = DISPLAY;
;            Audio Setup = AUDIO.
;   Rules run in file order together with the other sections; the log shows the value before and after.
;
;   Example: default FPS limit 60 for the Widescreen Fix (GTASA.WidescreenFix.asi). It turns the menu entry "Frame Limiter"
;   into an fps selector that keeps its choice in the game's own frame limiter byte (0xBA6794) as an index:
;   0 = off, 1 = 30, 2 = 40, 3 = 50, 4 = 60, 5 = 75, 6 = 100, 7 = 120, 8 = 144, 9 = 165, 10 = 200, 11 = 240.
;   Only use this with that mod: the plain game only knows 0 and 1, and the number is meaningless without it.
; Frame limit 60 fps = 0xBA6794 u8 4 When=DISPLAY

[Keys]
