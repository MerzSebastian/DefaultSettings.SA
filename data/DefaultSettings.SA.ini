;PED_CYCLE_WEAPON_RIGHT.Slot1=PADENTER
PED_CYCLE_WEAPON_LEFT=A OnlyIfLayout=AZERTY
;PED_CYCLE_WEAPON_LEFT=Q      ; French: A / PADDEL
;PED_CYCLE_WEAPON_LEFT.Slot1=PADDEL
;GO_FORWARD=UP      ; French slot 1: Z
; AZERTY FIX: on an AZERTY keyboard A<->Q and W<->Z are swapped compared to QWERTY, so the stock WASD keys
; (the game only uses ZQSD when its language is French) end up scattered. These rules apply only on an AZERTY
; layout and give ZQSD, mirroring the game's own French defaults. Not tested on real AZERTY hardware.
; (The French defaults also use the character ` for radio-up; it needs AltGr on AZERTY, so it is left out.)
GO_FORWARD.Slot1=Z OnlyIfLayout=AZERTY
;GO_FORWARD.Slot1=W
;GO_BACK=DOWN
;GO_BACK.Slot1=S
;GO_LEFT=LEFT      ; French slot 1: Q
GO_LEFT.Slot1=Q OnlyIfLayout=AZERTY
