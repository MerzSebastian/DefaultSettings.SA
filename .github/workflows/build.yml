name: build

# Every push and pull request: build the plugin, run the self-test and the emulated-game test.
# A tag like v1.0.0: the same, and then a GitHub release with the zip is made.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build DefaultSettings.SA.asi (32-bit) and run the self-test
        shell: cmd
        run: build.bat

      - name: Emulated-game test
        shell: cmd
        run: tools\hooktest\run.bat

      - name: Check that the plugin is a 32-bit DLL
        shell: pwsh
        run: |
          $bytes = [IO.File]::ReadAllBytes('out/DefaultSettings.SA.asi')
          $pe = [BitConverter]::ToInt32($bytes, 0x3c)
          $machine = [BitConverter]::ToUInt16($bytes, $pe + 4)
          if ($machine -ne 0x14c) { throw ('DefaultSettings.SA.asi is not x86 (machine 0x{0:x})' -f $machine) }

      - name: Read the version from the source
        id: version
        shell: pwsh
        run: |
          $version = (Select-String -Path src/main.cpp -Pattern 'kVersion = "([^"]+)"').Matches[0].Groups[1].Value
          "version=$version" >> $env:GITHUB_OUTPUT
          if ('${{ github.ref_type }}' -eq 'tag' -and '${{ github.ref_name }}' -ne "v$version") {
            throw "The tag ${{ github.ref_name }} does not match kVersion $version in src/main.cpp"
          }

      - name: Package
        shell: pwsh
        run: |
          $name = 'DefaultSettings.SA-${{ steps.version.outputs.version }}'
          $stage = "dist/package/$name"
          New-Item -ItemType Directory -Force -Path "$stage/scripts", "$stage/docs" | Out-Null
          Copy-Item out/DefaultSettings.SA.asi, out/DefaultSettings.SA.ini "$stage/scripts"
          Copy-Item README.md, LICENSE, CHANGELOG.md $stage
          Copy-Item docs/SETTINGS.md "$stage/docs"
          Compress-Archive -Path "$stage/*" -DestinationPath "dist/$name.zip"
          $hash = (Get-FileHash "dist/$name.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  $name.zip" | Out-File -Encoding ascii dist/SHA256SUMS.txt
          Get-ChildItem -Recurse $stage -File | ForEach-Object { $_.FullName.Substring((Resolve-Path $stage).Path.Length + 1) }
          Get-Content dist/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: DefaultSettings.SA
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt

  release:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: DefaultSettings.SA
          path: out
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
          body: |
            Unpack the zip into your GTA San Andreas folder (v1.0 US) so the two files end up in `scripts`.
            An ASI loader is needed. See the README inside the zip. Verify the download with `SHA256SUMS.txt`.
            The source code of this version is this repository at this tag.
